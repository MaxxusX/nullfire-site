  astro: patches/astro.patch
packageExtensions:
  '@astrojs/internal-helpers':
    dependencies:
      '@shikijs/core': '4.4.3'
      '@shikijs/langs': '4.4.3'
      '@shikijs/themes': '4.4.3'
      '@shikijs/engine-oniguruma': '4.4.3'
  'astro':
    dependencies:
      '@shikijs/core': '4.4.3'
